<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHIMINI Admin | Login</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background-color: var(--color-ivory); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">

  <div style="background: var(--color-white); padding: 50px; border-radius: 8px; box-shadow: 0 10px 40px var(--color-shadow); max-width: 450px; width: 100%;">
    <div style="text-align: center; margin-bottom: 30px;">
      <img src="../logo.png" alt="CHIMINI Logo" style="height: 45px; margin-bottom: 20px;">
      <h1 style="font-family: var(--font-serif); color: var(--color-primary-dark); font-size: 1.8rem; margin: 0;">Admin Portal</h1>
      <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-top: 10px;">Sign in to manage your store</p>
    </div>

    <div id="errorMsg" style="display: none; background: #ffebee; color: #c62828; padding: 12px; border-radius: 4px; font-size: 0.9rem; margin-bottom: 20px; text-align: center;"></div>
    <div id="setupMsg" style="display: none; background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 4px; font-size: 0.9rem; margin-bottom: 20px; text-align: center;"></div>

    <form id="loginForm">
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-primary-dark); margin-bottom: 8px;">Email Address</label>
        <input type="email" id="email" class="admin-form-control" style="width: 100%; padding: 12px; border: 1px solid var(--color-border); border-radius: 4px; font-family: var(--font-sans);" required placeholder="chiminiofficial@gmail.com">
      </div>
      
      <div style="margin-bottom: 30px;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-primary-dark); margin-bottom: 8px;">Password</label>
        <input type="password" id="password" class="admin-form-control" style="width: 100%; padding: 12px; border: 1px solid var(--color-border); border-radius: 4px; font-family: var(--font-sans);" required>
      </div>

      <button type="submit" id="loginBtn" class="btn-accent" style="width: 100%; padding: 15px; font-size: 1rem;">Sign In</button>
    </form>

    <div style="margin-top: 30px; text-align: center; border-top: 1px solid var(--color-border); padding-top: 20px;">
      <p style="font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 10px;">First time setup? Make sure you added your Supabase keys to <code>config.js</code>.</p>
      <button id="setupAdminBtn" style="background: none; border: none; color: var(--color-accent); text-decoration: underline; cursor: pointer; font-family: var(--font-sans); font-size: 0.85rem;">Create default admin account</button>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
